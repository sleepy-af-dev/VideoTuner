name: CI

# Lint, type-check, and test. Each job installs from the frozen lockfile, so CI
# uses exactly the locked versions and fails if the lockfile drifts from pyproject.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run basedpyright src tests

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pytest

  # build.py otherwise runs only on a version tag, so a dependency URL, checksum
  # or archive layout that has moved upstream is discovered after the tag is
  # pushed. This downloads and verifies the bundled dependencies without the
  # Nuitka compile, which is the half that talks to the network.
  bundled-deps:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python build.py --deps-only

  # ffms2 is built from source for a release, and the release workflow only runs
  # on a version tag, so without this nothing exercises the build until the tag
  # is already pushed. The vcpkg cache keys on the build script and the runner
  # image, so this is only slow when one of those changes.
  ffms2:
    runs-on: windows-latest
    # A cold cache compiles FFmpeg and its dependency tree, which measured 42 of
    # the 45 minutes this was first set to. Warm runs take a couple of minutes,
    # so the cap only has to be generous enough that runner variance on the cold
    # path cannot kill a build that is working.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Read the runner image version
        id: image
        shell: pwsh
        run: |
          if (-not $env:ImageVersion) {
            throw "ImageVersion is unset; the cache key would silently lose its image discriminator"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$env:ImageVersion"

      # vcpkg matches its archives by ABI hash, which folds in the MSVC toolset
      # and Windows SDK. Those ship with the runner image, so an image bump
      # invalidates every archive at once. Keying only on the build script left
      # the key fixed while the contents expired, and actions/cache will not
      # overwrite a key that already exists: the job rebuilt everything and then
      # discarded the result, every run, with no way to recover. Naming the
      # image version means a bump misses, builds once, and saves.
      #
      # No restore-keys: a partial match can only return archives from another
      # image, which is precisely the set vcpkg cannot use.
      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ steps.image.outputs.version }}-${{ hashFiles('.github/scripts/build-ffms2.ps1') }}

      - name: Build ffms2
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          .github/scripts/build-ffms2.ps1 -OutDir "${{ runner.temp }}/ffms2"

      # The release feeds the build output straight into build.py, and that hand-off
      # is the one part of it the deps job cannot cover, since it has no built ffms2.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python build.py --deps-only --ffms2-dir "${{ runner.temp }}/ffms2"
