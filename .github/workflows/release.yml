name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"

      - name: Extract version info
        id: version
        shell: python
        run: |
          import os
          import re
          import sys
          sys.path.insert(0, "src")
          from videotuner.version import __version__

          # Write to GitHub outputs
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={__version__}\n")

          # Extract this version's section from CHANGELOG.md, which is the only
          # place release notes are written. Matches from "## [X.Y.Z]" up to the
          # next "## " heading or the link definitions at the end of the file.
          with open("CHANGELOG.md", encoding="utf-8") as f:
              changelog = f.read()

          pattern = rf"## \[{re.escape(__version__)}\].*?(?=\n## |\n\[|\Z)"
          match = re.search(pattern, changelog, re.DOTALL)

          if match:
              current_notes = match.group(0).strip()
          else:
              current_notes = f"Release {__version__}"

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(current_notes)

      - name: Verify tag matches version
        shell: bash
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          CODE_VERSION="v${{ steps.version.outputs.version }}"
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match code version ($CODE_VERSION)"
            exit 1
          fi

      - name: Build release
        run: python build.py

      - name: Create release zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $releaseName = "VideoTuner-v$version"
          Compress-Archive -Path "dist/$releaseName/*" -DestinationPath "dist/$releaseName.zip"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --title "VideoTuner v${{ steps.version.outputs.version }}" `
            --notes-file release_notes.md `
            "dist/VideoTuner-v${{ steps.version.outputs.version }}.zip"