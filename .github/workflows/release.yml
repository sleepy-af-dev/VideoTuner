name: Build and Release

# A tag push builds and publishes. A manual run builds exactly the same way and
# uploads the zip as an artifact instead, so a change to this workflow can be
# exercised without spending a version number on finding out it was wrong.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # A healthy release takes about 20 minutes, or an hour when the vcpkg cache
    # has gone cold and FFmpeg is compiled from scratch. Generous against that,
    # and far short of the 6 hours a job otherwise gets to hang for.
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Install from the lockfile rather than resolving. pip took the newest
      # nuitka satisfying the constraint in pyproject, so the published binary
      # was compiled by a version no local build had ever used. The interpreter
      # comes from .python-version, the same as every other job.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install build dependencies
        run: uv sync --frozen --extra build

      # Reads the version from version.py and the notes from CHANGELOG.md, and
      # fails if that version has no section. Lives in a script so the test suite
      # covers it; see tests/test_release_notes.py.
      - name: Extract version info
        id: version
        run: uv run python .github/scripts/release_notes.py

      # Keyed on the event rather than on ref_type: this workflow's push trigger
      # is tags only, so a push is always a tag, while a manual run can be aimed
      # at a tag ref too, and that must not be mistaken for a release.
      - name: Verify tag matches version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          CODE_VERSION="v${{ steps.version.outputs.version }}"
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match code version ($CODE_VERSION)"
            exit 1
          fi

      # ffms2 has published no binary since 5.0, so the release bundles one
      # built from a later commit. The pins live in the build script. Caching
      # vcpkg's compiled packages keeps this to seconds once warm; a cold cache
      # compiles FFmpeg, which is the long part.
      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/scripts/build-ffms2.ps1') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Build ffms2
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          .github/scripts/build-ffms2.ps1 -OutDir "${{ runner.temp }}/ffms2"

      - name: Build release
        run: uv run python build.py --ffms2-dir "${{ runner.temp }}/ffms2"

      - name: Create release zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $releaseName = "VideoTuner-v$version"
          Compress-Archive -Path "dist/$releaseName/*" -DestinationPath "dist/$releaseName.zip"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --title "VideoTuner v${{ steps.version.outputs.version }}" `
            --notes-file release_notes.md `
            "dist/VideoTuner-v${{ steps.version.outputs.version }}.zip"

      # The zip a release would have published, kept long enough to install and
      # run. The notes go with it because they are generated here rather than
      # written by hand, so they are worth reading before a tag exists.
      - name: Upload dry-run build
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: VideoTuner-v${{ steps.version.outputs.version }}-dry-run
          path: |
            dist/VideoTuner-v${{ steps.version.outputs.version }}.zip
            release_notes.md
          retention-days: 7
          if-no-files-found: error
          # The payload is already a zip, so re-compressing it only costs time
          compression-level: 0