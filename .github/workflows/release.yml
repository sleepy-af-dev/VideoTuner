name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"

      - name: Extract version info
        id: version
        shell: python
        run: |
          import os
          import re
          import sys
          sys.path.insert(0, "src")
          from videotuner.version import __version__

          # Write to GitHub outputs
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={__version__}\n")

          # Extract this version's section from CHANGELOG.md, which is the only
          # place release notes are written. Matches from "## [X.Y.Z]" up to the
          # next "## " heading or the link definitions at the end of the file.
          with open("CHANGELOG.md", encoding="utf-8") as f:
              changelog = f.read()

          pattern = rf"## \[{re.escape(__version__)}\].*?(?=\n## |\n\[|\Z)"
          match = re.search(pattern, changelog, re.DOTALL)

          # Fail rather than publishing a release whose notes are just its version
          # number. A missing section means the heading was never promoted out of
          # Unreleased, and a published release is awkward to take back.
          if not match:
              raise SystemExit(
                  f"::error::CHANGELOG.md has no '## [{__version__}]' section. "
                  "Promote the Unreleased heading before tagging."
              )

          current_notes = match.group(0).strip()

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(current_notes)

      - name: Verify tag matches version
        shell: bash
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          CODE_VERSION="v${{ steps.version.outputs.version }}"
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match code version ($CODE_VERSION)"
            exit 1
          fi

      # ffms2 has published no binary since 5.0, so the release bundles one
      # built from a later commit. The pins live in the build script. Caching
      # vcpkg's compiled packages keeps this to seconds once warm; a cold cache
      # compiles FFmpeg, which is the long part.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/scripts/build-ffms2.ps1') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Build ffms2
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          .github/scripts/build-ffms2.ps1 -OutDir "${{ runner.temp }}/ffms2"

      - name: Build release
        run: python build.py --ffms2-dir "${{ runner.temp }}/ffms2"

      - name: Create release zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $releaseName = "VideoTuner-v$version"
          Compress-Archive -Path "dist/$releaseName/*" -DestinationPath "dist/$releaseName.zip"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --title "VideoTuner v${{ steps.version.outputs.version }}" `
            --notes-file release_notes.md `
            "dist/VideoTuner-v${{ steps.version.outputs.version }}.zip"